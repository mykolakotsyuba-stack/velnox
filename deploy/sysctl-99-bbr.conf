# BBR congestion control for PROD host (velnox.eu / IONOS, Berlin DE)
#
# WHY: the route from UA ISPs to the IONOS host has 7-20% packet loss (RTT ~60ms).
# Default CUBIC collapses its window on loss -> large assets (schema.png ~0.8MB,
# schema.svg 0.3-1.7MB, GLB 8-14MB) crawled at ~55 KB/s (10-15s each, "modem-like"
# progressive paint). Mathis: MSS/(RTT*sqrt(loss)) ~= 54 KB/s, matched measurement.
# BBR does not react to loss with window collapse -> same schema.png jumped to
# 700-980 KB/s (~12x, 15s -> 1s), GLB 8.4MB to 3.9 MB/s.
#
# SCOPE: host-level sysctl on the shared Ubuntu host. NOT part of the Docker stack,
# so deploy_prod.sh does NOT apply it. Kept here for audit trail + reproducibility.
#
# APPLIED ON HOST (2026-07-07), persisted as:
#   /etc/sysctl.d/99-bbr.conf        (the two lines below)
#   /etc/modules-load.d/bbr.conf     (contains: tcp_bbr)
# Then: sudo modprobe tcp_bbr && sudo sysctl --system
# Verify: sysctl net.ipv4.tcp_congestion_control  (-> bbr)

net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr
