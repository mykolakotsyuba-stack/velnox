# VELNOX production — velnox.eu
# Isolated server block; the default_server site is left untouched so other
# projects on this host keep working. App runs in Docker (127.0.0.1:8505/8506).

# ---- HTTP: redirect everything to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name velnox.eu www.velnox.eu;
    return 301 https://velnox.eu$request_uri;
}

# ---- HTTPS: www -> apex ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.velnox.eu;

    ssl_certificate     /etc/ssl/velnox/velnox.pem;
    ssl_certificate_key /etc/ssl/velnox/velnox.key;

    return 301 https://velnox.eu$request_uri;
}

# ---- HTTPS: main site ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name velnox.eu;

    ssl_certificate     /etc/ssl/velnox/velnox.pem;
    ssl_certificate_key /etc/ssl/velnox/velnox.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:VELNOX_SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100M;

    # Security / SEO headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml application/xml+rss application/rss+xml
        font/ttf font/otf application/font-woff application/vnd.ms-fontobject
        image/svg+xml application/manifest+json;

    # ---- Compat: the codebase and the DB hardcode the dev "/velnox" basePath
    # into raw asset/link paths (e.g. /velnox/images/..., /velnox/models/...,
    # and product_assets.path in SQLite). On the root domain we simply strip the
    # prefix and re-run location matching, so both static media and stray page
    # links keep working without editing 30 files or rewriting the database.
    location ^~ /velnox/ {
        rewrite ^/velnox/(.*)$ /$1 last;
    }

    # ---- Laravel API ----
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8506;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Laravel public storage (uploaded files) ----
    location ^~ /storage/ {
        proxy_pass http://127.0.0.1:8506;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ---- Next.js hashed build assets: cache forever ----
    location /_next/static/ {
        proxy_pass http://127.0.0.1:8505;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- Static media (images, 3D models, fonts) — long cache ----
    location ~* \.(?:woff2?|ttf|otf|eot|svg|png|jpe?g|webp|avif|gif|ico|glb|gltf|mp4|webm)$ {
        proxy_pass http://127.0.0.1:8505;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # NOT content-hashed -> long cache but revalidatable (no `immutable`),
        # so updated media propagates and a bad response can never stick forever.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
    }

    # ---- Everything else -> Next.js (HTML, no cache) ----
    location / {
        proxy_pass http://127.0.0.1:8505;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
